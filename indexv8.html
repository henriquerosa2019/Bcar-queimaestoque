<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bcar Autopeças — Liquidação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16150F;
    --paper:#F4F2EC;
    --card:#FFFFFF;
    --line:#DCD9CF;
    --muted:#77746B;
    --red:#E02A1B;
    --red-dark:#B01D11;
    --hazard:#FFC400;
    --green:#128C3E;
    --green-dark:#0C6B2E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}

  /* Header */
  header{background:var(--ink);color:#F4F2EC;padding:14px 0}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand h1{margin:0;line-height:0}
  .brand-logo{height:52px;width:auto;display:block}
  @media(max-width:520px){.brand-logo{height:42px}}
  .brand .tag{font-family:'Space Mono',monospace;font-size:11px;color:var(--hazard);border:1px solid var(--hazard);padding:2px 6px;border-radius:3px;white-space:nowrap}
  .head-sub{font-size:12.5px;color:#B8B5AC;font-weight:500}

  /* Hazard flash bar */
  .flash{
    background:var(--red);color:#fff;
    border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);
    background-image:repeating-linear-gradient(45deg,transparent 0 22px,rgba(0,0,0,.10) 22px 44px);
  }
  .flash-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
  .flash-title{font-family:'Archivo Narrow',sans-serif;font-weight:700;text-transform:uppercase;font-size:19px;letter-spacing:.03em;display:flex;align-items:center;gap:9px}
  .bolt{background:var(--hazard);color:var(--ink);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex-shrink:0}
  .countdown{display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace}
  .cd-label{font-size:11px;text-transform:uppercase;opacity:.85;letter-spacing:.05em}
  .cd-clock{background:rgba(0,0,0,.28);padding:5px 10px;border-radius:5px;font-size:17px;font-weight:700;letter-spacing:.05em}

  /* Search */
  .toolbar{position:sticky;top:0;z-index:20;background:var(--paper);padding:16px 0 10px;border-bottom:1px solid var(--line)}
  .search-box{position:relative}
  .search-box svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
  input[type=search]{
    width:100%;font-family:'Archivo',sans-serif;font-size:16px;font-weight:500;
    padding:15px 16px 15px 46px;border:2px solid var(--ink);border-radius:10px;
    background:var(--card);color:var(--ink);outline:none;
  }
  input[type=search]::placeholder{color:var(--muted);font-weight:400}
  input[type=search]:focus{border-color:var(--red)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;-webkit-overflow-scrolling:touch}
  .chip{
    font-family:'Space Mono',monospace;font-size:12.5px;white-space:nowrap;cursor:pointer;
    padding:7px 13px;border:1.5px solid var(--line);border-radius:20px;background:var(--card);color:var(--muted);
    transition:all .12s;user-select:none;
  }
  .chip:hover{border-color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .count{font-size:13px;color:var(--muted);padding:14px 0 4px;font-family:'Space Mono',monospace}

  /* Grid */
  .grid{display:grid;grid-template-columns:1fr;gap:14px;padding:8px 0 40px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:860px){.grid{grid-template-columns:1fr 1fr 1fr}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(22,21,15,.10)}
  .card.hot{border-color:var(--red)}
  .thumb{position:relative;aspect-ratio:4/3;background:#EFEDE6;display:grid;place-items:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb-fallback{text-align:center;padding:10px}
  .thumb-fallback .fb-code{font-family:'Space Mono',monospace;font-size:15px;color:var(--muted);font-weight:700}
  .thumb-fallback .fb-icon{width:38px;height:38px;color:#C4C1B6;margin:0 auto 8px}
  .hot-badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-family:'Archivo Narrow',sans-serif;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;padding:4px 9px;border-radius:5px;display:flex;align-items:center;gap:4px}
  .off-badge{position:absolute;top:10px;right:10px;background:var(--hazard);color:var(--ink);font-family:'Space Mono',monospace;font-weight:700;font-size:13px;padding:4px 8px;border-radius:5px}

  .body{padding:13px 14px 15px;display:flex;flex-direction:column;flex:1}
  .cat{font-family:'Space Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .name{font-weight:600;font-size:15.5px;line-height:1.25;margin:5px 0 3px}
  .code{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:12px}
  .price-row{margin-top:auto;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .price-old{font-size:13.5px;color:var(--muted);text-decoration:line-through}
  .price-now{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:26px;color:var(--red-dark)}
  .wpp{
    margin-top:13px;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--green);color:#fff;font-family:'Archivo',sans-serif;font-weight:600;font-size:15px;
    padding:12px;border-radius:10px;text-decoration:none;transition:background .12s;
  }
  .wpp:hover{background:var(--green-dark)}
  .wpp svg{width:19px;height:19px}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty strong{display:block;font-size:18px;color:var(--ink);margin-bottom:6px;font-family:'Archivo Narrow',sans-serif;text-transform:uppercase}

  footer{border-top:1px solid var(--line);padding:22px 0 34px;text-align:center;color:var(--muted);font-size:12.5px}
  footer .wpp-foot{color:var(--green-dark);font-weight:600;text-decoration:none}

  .equiv{font-size:11px;color:#6b6b6b;margin:2px 0 6px;line-height:1.35;max-height:50px;overflow:hidden}
  .price-consulta{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:20px;color:#8a5a00}
  .motivo{font-family:'Space Mono',monospace;font-size:10.5px;color:#9a8a60;text-transform:uppercase;letter-spacing:.04em}
  .arow-ed{display:block;padding:12px 0}
  .ed-lin{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
  .ed-lin:last-child{margin-bottom:0}
  .ed-lb{font-size:11px;color:#888;min-width:42px}
  .btn-del{background:#fff;color:#b91c1c;border:1.5px solid #f0b4b4;border-radius:8px;padding:8px 11px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
  .btn-del:hover{background:#b91c1c;color:#fff;border-color:#b91c1c}
  .btn-del.conf{background:#b91c1c;color:#fff;border-color:#b91c1c}
  .cat-select{font-family:inherit;padding:10px 12px;border:1.5px solid #d9d5cc;border-radius:9px;background:#fff;font-size:14px;max-width:230px}
  .status{padding:26px 0;text-align:center;color:#666;font-size:15px}
  .note{padding:8px 0 2px;color:#777;font-size:12.5px}
  .admin-bar{background:#111;color:#fff}
  .admin-wrap{max-width:1080px;margin:0 auto;padding:16px}
  .admin-card{background:#fff;border:1.5px solid #e5e1d8;border-radius:12px;padding:16px;margin:14px auto;max-width:1080px}
  .admin-card h3{margin:0 0 10px;font-family:'Archivo Narrow',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:17px}
  .arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed #ececec}
  .arow .nm{flex:1;min-width:190px;font-size:13.5px}
  .arow .cd{font-family:'Space Mono',monospace;font-size:12px;color:#888;min-width:70px}
  .inp{font-family:inherit;padding:8px 10px;border:1.5px solid #d9d5cc;border-radius:8px;font-size:14px}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
  .btn.sec{background:#e9e9e9;color:#111}
  .msg-ok{color:#166534;font-weight:700;font-size:13px}
  .msg-err{color:#b91c1c;font-weight:700;font-size:13px}

  .price-de{font-size:12px;color:#8a8a8a}
  .price-por{font-size:12px;color:#111;font-weight:600}
  .admin-link{color:#9a958c;cursor:pointer;text-decoration:underline;font-size:12px}
  .tabbtn{background:#eee;color:#111;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;margin-right:8px}
  .tabbtn.on{background:var(--ink);color:#fff}
  .ofbtn{background:#fff;color:var(--red-dark);border:1.5px solid var(--red);border-radius:9px;padding:9px 14px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
  .ofbtn.on{background:var(--red);color:#fff}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:22px}
  .modal{background:#F4F2EC;border-radius:14px;max-width:940px;width:100%;margin:auto;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .modal-head strong{font-family:'Archivo Narrow',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:16px}
  .modal-close{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:700;font-family:inherit}
  .discbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff7e6;border:1px solid #ffe2a8;padding:9px;border-radius:9px;margin:8px 0}
</style>
</head>

/* --- Log de buscas: grava termo, codigo/nome do 1o resultado, data e hora --- */
async function logarBusca(termo, resultados){
  try{
    const top = resultados && resultados.length ? resultados[0] : null;
    await sb.from('busca_produto').insert({
      termo_buscado:  String(termo).slice(0,160),
      codigo_produto: top ? (top.codigo_principal||null) : null,
      nome_produto:   top ? (top.produto||null) : null,
      resultados:     resultados ? resultados.length : 0
    });
  }catch(e){ /* silencioso: o log nunca pode quebrar a loja */ }
}
function useLogBusca(q, resultados){
  const ultimo = React.useRef("");
  useEffect(()=>{
    const termo = (q||"").trim();
    if(termo.length < 2) return;
    const id = setTimeout(()=>{
      if(termo === ultimo.current) return;   // nao repete o mesmo termo
      ultimo.current = termo;
      logarBusca(termo, resultados);
    }, 1200);                                 // so grava quando o cliente para de digitar
    return ()=>clearTimeout(id);
  },[q, resultados]);
}

  const msg = pr!=null
    ? "Olá! Tenho interesse na peça "+cod+" — "+nome+" por "+brl(pr)+". Ainda tem disponível?"
    : "Olá! Qual o preço e a disponibilidade da peça "+cod+" — "+nome+"?";
  return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
}
function useCountdown(fim){
  function restante(){ const a=new Date(fim).getTime(); return isNaN(a)?0:Math.max(0,a-Date.now()); }
  const [t,setT]=useState(restante());
  useEffect(()=>{ const id=setInterval(()=>setT(restante()),1000); return ()=>clearInterval(id); },[fim]);
  const a=new Date(fim).getTime();
  if(!fim || isNaN(a) || t<=0) return {label:"Oferta",text:"Encerrada"};
  const s=Math.floor(t/1000), d=Math.floor(s/86400);
  const hh=String(Math.floor((s%86400)/3600)).padStart(2,'0');
  const mm=String(Math.floor((s%3600)/60)).padStart(2,'0');
  const ss=String(s%60).padStart(2,'0');
  return {label:"Acaba em",text:(d>0?d+"d ":"")+hh+":"+mm+":"+ss};
}
function IconGear(){
  return <svg className="fb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
}
function IconWpp(){
  return <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.49 0 1.47 1.07 2.89 1.22 3.09.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35zM12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.05-1.32A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>;
}
function Card({p}){
  const oferta=emOferta(p), d=descPct(p);
  return (
    <div className={"card"+(oferta?" hot":"")}>
      <div className="thumb">
        <div className="thumb-fallback" style={{display:'block'}}><IconGear/><div className="fb-code">{p.codigo_principal||"—"}</div></div>
        {oferta && <span className="hot-badge">⚡ Oferta</span>}
        {d>0 && <span className="off-badge">-{d}%</span>}
      </div>
      <div className="body">
        <span className="cat">{p.grupo}</span>
        <div className="name">{p.produto}</div>
        <div className="code">Ref. {p.codigo_principal||"—"}</div>
        {p.equivalentes && <div className="equiv">Equivalentes: {p.equivalentes}</div>}
        <div className="price-row">
          {consultar(p)
            ? <React.Fragment>
                <span className="price-consulta">Consultar preço</span>
                <span className="motivo">{motivoConsulta(p)}</span>
              </React.Fragment>
            : oferta
              ? <React.Fragment>
                  <span className="price-de">De <span className="price-old">{brl(p.preco_venda)}</span></span>
                  <span className="price-por">Por <span className="price-now">{brl(p.preco_custo)}</span></span>
                </React.Fragment>
              : <span className="price-now">{brl(p.preco_venda)}</span>}
        </div>
        <a className="wpp" href={linkWpp(p)} target="_blank" rel="noopener"><IconWpp/> {precoAtual(p)!=null?"Pedir no WhatsApp":"Consultar no WhatsApp"}</a>
      </div>
    </div>
  );
}
const LIMITE=200;
function LinhaPreco({p,onSalvar,onExcluir}){
  const [nome,setNome]=useState(p.produto||"");
  const [equiv,setEquiv]=useState(p.equivalentes||"");
  const [v,setV]=useState(p.preco_venda!=null?String(p.preco_venda):"");
  const [c,setC]=useState(p.preco_custo!=null?String(p.preco_custo):"");
  const [conf,setConf]=useState(false);
  useEffect(()=>{ if(!conf) return; const id=setTimeout(()=>setConf(false),4000); return ()=>clearTimeout(id); },[conf]);
  const sujo = nome!==(p.produto||"") || equiv!==(p.equivalentes||"")
            || v!==(p.preco_venda!=null?String(p.preco_venda):"")
            || c!==(p.preco_custo!=null?String(p.preco_custo):"");
  return (
    <div className="arow arow-ed">
      <div className="ed-lin">
        <span className="cd">{p.codigo_principal}</span>
        <input className="inp" style={{flex:1,minWidth:220}} placeholder="Nome do produto"
               value={nome} onChange={e=>setNome(e.target.value)}/>
      </div>
      <div className="ed-lin">
        <label className="ed-lb">Equiv.</label>
        <input className="inp" style={{flex:1,minWidth:220}}
               placeholder="Códigos equivalentes, separados por vírgula"
               value={equiv} onChange={e=>setEquiv(e.target.value)}/>
      </div>
      <div className="ed-lin">
        <label className="ed-lb">Venda</label>
        <input className="inp" style={{width:90}} inputMode="decimal" placeholder="vazio" value={v} onChange={e=>setV(e.target.value)}/>
        <label className="ed-lb">Custo</label>
        <input className="inp" style={{width:90}} inputMode="decimal" placeholder="vazio" value={c} onChange={e=>setC(e.target.value)}/>
        <button className={"btn"+(sujo?"":" sec")} onClick={()=>onSalvar(p.codigo_principal, nome, equiv, v, c)}>
          {sujo ? "Salvar •" : "Salvar"}
        </button>
        <button
          className={"btn-del"+(conf?" conf":"")}
          title="Remove o produto da vitrine (reversível no banco)"
          onClick={()=>{ if(conf){ setConf(false); onExcluir(p.codigo_principal, p.produto); } else setConf(true); }}>
          {conf ? "Confirmar exclusão?" : "Excluir"}
        </button>
      </div>
    </div>
  );
}
function Admin({produtos, grupos, fimOferta, onClose, onPrazo, onSalvo, onExcluido, onReload}){
  const [senha,setSenha]=useState("");
  const [ok,setOk]=useState(false);
  const [prazo,setPrazo]=useState((fimOferta||"").slice(0,16));
  const [msg,setMsg]=useState(null);
  const [aba,setAba]=useState("produto");
  const [busca,setBusca]=useState("");
  const [gsel,setGsel]=useState("");
  const [descTipo,setDescTipo]=useState("pct");
  const [descVal,setDescVal]=useState("");
  useEffect(()=>{ setPrazo((fimOferta||"").slice(0,16)); },[fimOferta]);
  function entrar(){ if(senha===ADMIN_SENHA){ setOk(true); setMsg(null);} else setMsg({t:"err",m:"Senha incorreta."}); }
  async function salvarPrazo(){
    setMsg(null);
    const valor = prazo.length===16 ? prazo+":00" : prazo;
    const { error } = await sb.rpc('admin_set_prazo',{ p_senha:senha, p_valor:valor });
    if(error) setMsg({t:"err",m:"Erro: "+error.message}); else { onPrazo(valor); setMsg({t:"ok",m:"Prazo atualizado."}); }
  }
  function parsePreco(s){
    const t=String(s==null?"":s).trim();
    if(t==="") return null;                     // vazio = sem preco => "Consultar preco"
    const n=parseFloat(t.replace(',','.'));
    return isNaN(n) ? undefined : n;            // undefined = invalido
  }
  async function salvarProduto(cod, nome, equiv, venda, custo){
    const nm=String(nome||"").trim();
    if(!nm){ setMsg({t:"err",m:"O nome não pode ficar vazio ("+cod+")."}); return; }
    const pv=parsePreco(venda), pc=parsePreco(custo);
    if(pv===undefined||pc===undefined){ setMsg({t:"err",m:"Preço inválido em "+cod+". Use 0,00 ou deixe vazio."}); return; }
    const eq=String(equiv||"").trim() || null;
    const { error } = await sb.rpc('admin_salvar_produto',{
      p_senha:senha, p_codigo:cod, p_nome:nm, p_equivalentes:eq, p_venda:pv, p_custo:pc
    });
    if(error){ setMsg({t:"err",m:"Erro: "+error.message}); return; }
    onSalvo(cod, { produto:nm, equivalentes:eq, preco_venda:pv, preco_custo:pc });
    setMsg({t:"ok",m:cod+" salvo — "+nm+(pv!=null?" · venda "+brl(pv):" · sem preço de venda")+(pc!=null?" · custo "+brl(pc):"")});
  }
  async function excluirProduto(cod, nome){
    setMsg({t:"ok",m:"Excluindo "+cod+"…"});
    const { data, error } = await sb.rpc('admin_excluir_produto',{ p_senha:senha, p_codigo:cod });
    if(error){ setMsg({t:"err",m:"Erro ao excluir: "+error.message}); return; }
    if(!data){ setMsg({t:"err",m:"Nada excluído — código "+cod+" não encontrado."}); return; }
    onExcluido(cod);
    setMsg({t:"ok",m:"Produto "+cod+" ("+(nome||"")+") removido da vitrine."});
  }
  async function aplicarDesconto(cods){
    const v=parseFloat(String(descVal).replace(',','.'));
    if(!cods.length){ setMsg({t:"err",m:"Nenhum produto listado."}); return; }
    if(isNaN(v)){ setMsg({t:"err",m:"Informe o desconto."}); return; }
    setMsg({t:"ok",m:"Aplicando…"});
    const { data, error } = await sb.rpc('admin_desc_codigos',{ p_senha:senha, p_codigos:cods, p_tipo:descTipo, p_valor:v });
    if(error) setMsg({t:"err",m:"Erro: "+error.message});
    else { await onReload(); setMsg({t:"ok",m:(data||0)+" produto(s) com desconto de "+(descTipo==='pct'?v+"%":brl(v))+" (Por = venda − desconto)."}); }
  }
  if(!ok){
    return (
      <div>
        <h3 style={{marginTop:4}}>Área do lojista — entrar</h3>
        <div className="arow" style={{borderBottom:'none'}}>
          <input className="inp" type="password" placeholder="Senha" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')entrar();}}/>
          <button className="btn" onClick={entrar}>Entrar</button>
          {msg && <span className={msg.t==='ok'?'msg-ok':'msg-err'}>{msg.m}</span>}
        </div>
      </div>
    );
  }
  const termo=busca.trim().toLowerCase();
  const lista = aba==="produto"
    ? (termo ? produtos.filter(p => (p.produto||"").toLowerCase().includes(termo) || (p.codigo_principal||"").toLowerCase().includes(termo)).slice(0,150) : [])
    : (gsel ? produtos.filter(p => p.grupo===gsel) : []);
  const cods = lista.map(p=>p.codigo_principal);
  return (
    <div>
      <div className="admin-card">
        <h3>Prazo da oferta (cronômetro)</h3>
        <div className="arow" style={{borderBottom:'none'}}>
          <input className="inp" type="datetime-local" value={prazo} onChange={e=>setPrazo(e.target.value)}/>
          <button className="btn" onClick={salvarPrazo}>Salvar prazo</button>
        </div>
      </div>
      <div className="admin-card">
        <h3>Alterar preços</h3>
        <div style={{marginBottom:8}}>
          <button className={"tabbtn"+(aba==="produto"?" on":"")} onClick={()=>{setAba("produto");}}>Por produto</button>
          <button className={"tabbtn"+(aba==="grupo"?" on":"")} onClick={()=>{setAba("grupo");}}>Por grupo</button>
        </div>
        {aba==="produto"
          ? <div className="arow" style={{borderBottom:'none'}}>
              <input className="inp" style={{flex:1,minWidth:240}} placeholder="Buscar produto por nome ou código…" value={busca} onChange={e=>setBusca(e.target.value)}/>
            </div>
          : <div className="arow" style={{borderBottom:'none'}}>
              <select className="inp" style={{minWidth:260}} value={gsel} onChange={e=>setGsel(e.target.value)}>
                <option value="">Escolha o grupo…</option>
                {grupos.map(g=><option key={g} value={g}>{g}</option>)}
              </select>
            </div>}
        {lista.length>0 && <div className="discbar">
          <strong style={{fontSize:13}}>Desconto nos {lista.length} listados:</strong>
          <select className="inp" value={descTipo} onChange={e=>setDescTipo(e.target.value)}>
            <option value="pct">% sobre a venda</option>
            <option value="val">R$ sobre a venda</option>
          </select>
          <input className="inp" style={{width:120}} inputMode="decimal" placeholder={descTipo==='pct'?'% desconto':'R$ desconto'} value={descVal} onChange={e=>setDescVal(e.target.value)}/>
          <button className="btn" onClick={()=>aplicarDesconto(cods)}>Aplicar desconto</button>
        </div>}
        {aba==="produto" && !termo && <div className="note">Digite acima para listar os produtos (ex.: "axial").</div>}
        {aba==="grupo" && !gsel && <div className="note">Escolha um grupo para listar os produtos.</div>}
        {(termo||gsel) && lista.length===0 && <div className="note">Nenhum produto encontrado.</div>}
        <div className="note" style={{marginTop:6}}>Nome · Equivalentes · Venda · Custo — edite e clique em Salvar. Preço vazio faz o produto aparecer como “Consultar preço”. O desconto acima altera só os preços.</div>
        {lista.map(p=> <LinhaPreco key={p.codigo_principal+'_'+p.produto+'_'+p.equivalentes+'_'+p.preco_venda+'_'+p.preco_custo} p={p} onSalvar={salvarProduto} onExcluir={excluirProduto}/> )}
        {aba==="produto" && lista.length===150 && <div className="note">Mostrando os primeiros 150. Refine a busca.</div>}
      </div>
      {msg && <div className="admin-card"><span className={msg.t==='ok'?'msg-ok':'msg-err'}>{msg.m}</span></div>}
    </div>
  );
}
function App(){
  const [produtos,setProdutos]=useState([]);
  const [fimOferta,setFimOferta]=useState("");
  const [carregando,setCarregando]=useState(true);
  const [erro,setErro]=useState(null);
  const [q,setQ]=useState("");
  const [cat,setCat]=useState("Todas");
  const [soOfertas,setSoOfertas]=useState(false);
  const [showAdmin,setShowAdmin]=useState(/admin/i.test(location.search+location.hash));

  async function carregar(){
    const cfg = await sb.from('config').select('valor').eq('chave','fim_oferta').single();
    if(cfg.data) setFimOferta(cfg.data.valor);
    const { data, error } = await sb.from('estoque')
      .select('grupo,produto,codigo_principal,marca,quantidade,preco_venda,preco_custo,equivalentes')
      .is('excluido_em', null)
      .limit(2000);
    if(error) throw error;
    const arr=(data||[]).slice();
    arr.sort((a,b)=>{
      const oa=emOferta(a)?0:1, ob=emOferta(b)?0:1; if(oa!==ob) return oa-ob;
      const g=(a.grupo||'').localeCompare(b.grupo||'','pt-BR'); if(g) return g;
      return (a.produto||'').localeCompare(b.produto||'','pt-BR');
    });
    setProdutos(arr);
  }
  useEffect(()=>{ (async()=>{ try{ await carregar(); }catch(e){ setErro(e.message||String(e)); } finally{ setCarregando(false); } })(); },[]);

  const clock=useCountdown(fimOferta);
  const grupos=useMemo(()=>Array.from(new Set(produtos.map(p=>p.grupo).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'pt-BR')),[produtos]);
  const nOfertas=useMemo(()=>produtos.filter(emOferta).length,[produtos]);
  const filtrados=useMemo(()=>{
    const termo=q.trim().toLowerCase();
    return produtos.filter(p=>{
      const okCat = (cat==="Todas" || p.grupo===cat) && (!soOfertas || emOferta(p));
      const okQ = !termo || (p.produto||"").toLowerCase().includes(termo) || (p.codigo_principal||"").toLowerCase().includes(termo) || (p.marca||"").toLowerCase().includes(termo) || (p.equivalentes||"").toLowerCase().includes(termo);
      return okCat && okQ;
    });
  },[produtos,q,cat,soOfertas]);
  const visiveis=filtrados.slice(0,LIMITE);

  useLogBusca(q, filtrados);   // grava termo + código/nome do 1º resultado + data/hora

  function onPrazo(v){ setFimOferta(v); }
  function onSalvo(cod,campos){ setProdutos(ps=>ps.map(p=>p.codigo_principal===cod?{...p,...campos}:p)); }
  function onExcluido(cod){ setProdutos(ps=>ps.filter(p=>p.codigo_principal!==cod)); }
  async function onReload(){ try{ await carregar(); }catch(e){} }

  return (
    <React.Fragment>
      <header>
        <div className="wrap head-row">
          <div className="brand">
            <h1><img className="brand-logo" src={LOGO} alt={LOJA}/></h1>
            <span className="tag">ESTOQUE FINAL</span>
          </div>
          <span className="head-sub">{SUBTITULO}</span>
        </div>
      </header>
      <div className="flash">
        <div className="flash-inner">
          <span className="flash-title"><span className="bolt">⚡</span>Oferta relâmpago</span>
          <span className="countdown"><span className="cd-label">{clock.label}</span><span className="cd-clock">{clock.text}</span></span>
        </div>
      </div>
      <div className="toolbar">
        <div className="wrap">
          <div className="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" placeholder="Buscar por nome, código, marca ou equivalente…" value={q} onChange={e=>setQ(e.target.value)}/>
          </div>
          <select className="cat-select" value={cat} onChange={e=>setCat(e.target.value)}>
            <option value="Todas">Todas as categorias</option>
            {grupos.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <button className={"ofbtn"+(soOfertas?" on":"")} onClick={()=>setSoOfertas(s=>!s)}>{soOfertas?"✓ Só ofertas":"🔥 Ver ofertas"}{nOfertas?(" ("+nOfertas+")"):""}</button>
        </div>
      </div>
      <div className="wrap">
        {carregando && <div className="status">Carregando produtos…</div>}
        {erro && <div className="status">Não foi possível carregar os produtos.<br/><small>{erro}</small></div>}
        {!carregando && !erro && <React.Fragment>
          <div className="count">{filtrados.length} {filtrados.length===1?"peça":"peças"}{soOfertas?" em oferta":""}</div>
          {filtrados.length>LIMITE && <div className="note">Mostrando {LIMITE} de {filtrados.length}. Use a busca ou a categoria para refinar.</div>}
          {visiveis.length>0 ? <div className="grid">{visiveis.map(p=><Card key={p.codigo_principal} p={p}/>)}</div>
            : <div className="empty"><strong>Nada encontrado</strong>Tente outro código, nome ou categoria.</div>}
        </React.Fragment>}
      </div>
      <footer>
        <div className="wrap">
          {LOJA} — {SUBTITULO} <span style={{opacity:.55}}>· {VERSAO}</span><br/>
          Dúvidas? <a className="wpp-foot" href={"https://wa.me/"+WHATSAPP} target="_blank" rel="noopener">Fale no WhatsApp</a>
          <br/><br/>
          <span className="admin-link" onClick={()=>setShowAdmin(true)}>área do lojista</span>
        </div>
      </footer>
      {showAdmin &&
        <div className="modal-bg" onClick={()=>setShowAdmin(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><strong>Área do lojista</strong><button className="modal-close" onClick={()=>setShowAdmin(false)}>Fechar ✕</button></div>
            <Admin produtos={produtos} grupos={grupos} fimOferta={fimOferta} onClose={()=>setShowAdmin(false)} onPrazo={onPrazo} onSalvo={onSalvo} onExcluido={onExcluido} onReload={onReload}/>
          </div>
        </div>}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
